<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="site-header">
        <a class="brand" href="/">highschoolcompass</a>
        <nav>
        <a href="/">Home</a>
        <a href="/about">About Us</a>

        <a href="/login">Login</a>
        <a href="/signup">Sign Up</a>
        </span>
        </nav>

    <main>
        <section class="hero">
            <h1>Login</h1>
            <p>Log in to get personalized feedback and career advice.</p>
        </section>

        <!-- Placeholder form only -- not wired up to any backend yet -->
        <form id="login-form" class="form-card">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <button type="submit">Log In</button>
            <p id="login-status" class="form-status"></p>
        </form>
        <p class="form-footnote">Don't have an account? <a href="/signup">Sign up here</a>.</p>
    </main>

    <footer class="site-footer">
