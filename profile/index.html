<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-config.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="gated">

    <header class="site-header sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-neutral-200">
        <div class="container-page flex items-center justify-between py-3">
            <a class="brand flex items-center gap-2 text-lg font-bold text-neutral-900 hover:text-primary-600 transition-colors" href="/">
                <img src="/media/HighSchoool-removebg-preview.png" alt="High School Compass logo" class="h-8 w-8 object-contain">
                High School Compass
            </a>

            <button id="nav-toggle" type="button" class="md:hidden inline-flex items-center justify-center p-2 rounded-lg text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 transition-colors" aria-expanded="false" aria-controls="site-nav">
                <span class="sr-only">Toggle menu</span>
                <svg id="nav-icon-open" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg id="nav-icon-close" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <nav id="site-nav" class="hidden md:flex flex-col md:flex-row md:items-center gap-1 container-page pb-4 md:pb-0">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/about">About Us</a>
        <a class="nav-link nav-restricted" href="/classes">Navigating Classes</a>
        <a class="nav-link nav-restricted" href="/clubs">Clubs</a>
        <a class="nav-link nav-restricted" href="/competitions">Competitions, Awards, and More</a>
        <a class="nav-link nav-restricted" href="/college-prep">College Prep</a>
        <a class="nav-link nav-restricted" href="/testing">Testing</a>
        <a class="nav-link nav-restricted" href="/career-advice">Career Advice</a>
        <span id="nav-auth" class="flex flex-col md:flex-row md:items-center gap-2 md:ml-2 md:pl-3 pt-3 md:pt-0 mt-2 md:mt-0 border-t md:border-t-0 md:border-l border-neutral-200">
        <a class="btn btn-ghost" href="/login">Login</a>
        <a class="btn btn-primary" href="/signup">Sign Up</a>
        </span>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Your Profile</h1>
            <p>Keep this up to date so we can personalize your career advice.</p>
        </section>

        <form id="profile-form" class="form-card">
            <label for="email">Email</label>
            <input type="email" id="email" disabled>

            <label for="name">Name</label>
            <input type="text" id="name" name="name">

            <label for="grade">Grade</label>
            <select id="grade" name="grade">
                <option value="">Select a grade</option>
                <option value="9">9th</option>
                <option value="10">10th</option>
                <option value="11">11th</option>
                <option value="12">12th</option>
            </select>

            <label for="school">School</label>
            <input type="text" id="school" name="school">

            <label for="interests">Interests</label>
            <input type="text" id="interests" name="interests" placeholder="e.g. robotics, writing, biology">

            <label for="gpa">GPA (4.0 unweighted / 5.0 weighted max)</label>
            <input type="number" id="gpa" name="gpa" min="0" max="5" step="0.01" placeholder="e.g. 3.85">

            <label for="transcript_link">Transcript (link)</label>
            <input type="text" id="transcript_link" name="transcript_link" placeholder="Link to your transcript (e.g. Google Drive)">

            <button type="submit">Save Profile</button>
            <p id="profile-status" class="form-status"></p>
        </form>
    </main>

    <footer class="site-footer border-t border-neutral-200 bg-white">
        <div class="container-page py-8 text-center text-sm text-neutral-500">
            <p>&copy; 2026 High School Compass &mdash; built by Veer &amp; Geetansh.</p>
            <p class="footer-links mt-2"><a class="text-neutral-500 hover:text-primary-600 underline underline-offset-2" href="/terms">Terms &amp; Conditions</a></p>
        </div>
    </footer>

    <script type="module" src="../script.js"></script>
    <script type="module" src="../auth-guard.js"></script>
    <script type="module" src="/profile/profile.js"></script>
</body>
</html>
